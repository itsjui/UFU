<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex2</title>
</head>
<body>
    <input type="text" name="nome">
    <button type="button">Digite seu nome</button>
    <p></p>
    <img src="/imagens/tela2.png" alt="tela" width="700">
    <script>
        const botao = document.querySelector("button");
        botao.onclick = function() {
            const campoNome = document.querySelector("input");
            const parSaida = document.querySelector("p");
            parSaida.textContent = 'Obrigado, ' + campoNome.value;
        }
    </script>
</body>
</html>
