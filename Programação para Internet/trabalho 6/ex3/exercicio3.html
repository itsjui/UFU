<body>

    <script>
        const botao = document.querySelector("button");

                console.log("seu peso ideal é: "+ resultado);
            }
            else{
                let altura = parseInt(campoAltura.value);
                let resultado = 52 + (0.67 * (campoAltura - 152.4));

        }
    </script>
