<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/imagem/icon.png">
    <link rel="stylesheet" href="src/style/login.css">
    <title>CarGO! Login</title>
</head>
<body>
    <main>
        <div class="loginBox">
            <h2>Login</h2>
            <form class="formUser" action="entrarUser" method="post">
                <div class="inputgroup">
                    <div class="loginSection">
                        <label for="Email"></label>
                        <input type="email" id="emailUser" name="email" placeholder="Email">
                        
                    </div>
                    <div class="password">
                        <label for="password"></label>
                        <input type="password" id="passwordUser" name="Senha" placeholder="Senha">
                    </div>
                    <button class="login-btn2">Login</button>
                </div>
            </form>
            <span>não possui conta ainda?<a href="cadastro.html">Registrar</a></span>
        </div>
    </main>
</body>
</html>
